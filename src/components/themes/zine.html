<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{BandName}</title>
<meta name="color:Paper" content="#fafaf9">
<meta name="color:Ink" content="#0a0a0a">
<meta name="color:Highlighter" content="#db2777">
<meta name="image:Cover" content="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap">
<style>
  :root { --paper: {color:Paper}; --ink: {color:Ink}; --hi: {color:Highlighter}; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.6 "Special Elite", ui-monospace, monospace;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem; }

  /* The name, cut out of magazines: every letter is its own scrap of paper,
     and nth-child picks its paper, type and tilt so no two neighbours match. */
  h1 { display: flex; flex-wrap: wrap; gap: 0.25em 0.4em; margin: 0 0 2rem; font-size: clamp(1.25rem, 7vw, 3.75rem); line-height: 1; font-weight: 400; }
  .word { display: inline-flex; flex-wrap: wrap; gap: 0.08em; }
  .letter {
    display: inline-block; padding: 0.1em 0.15em;
    background: var(--paper); color: var(--ink); outline: 1px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink); transform: rotate(-3deg);
  }
  .letter:nth-child(3n+1) { background: var(--ink); color: var(--paper); font-family: Anton, Impact, sans-serif; transform: rotate(4deg); }
  .letter:nth-child(4n+2) { font-family: Georgia, serif; font-style: italic; transform: rotate(-6deg); }
  .letter:nth-child(5n+3) { background: var(--hi); color: var(--paper); outline: none; transform: rotate(2deg); }
  .letter:nth-child(7n) { font-family: system-ui, sans-serif; font-weight: 900; transform: rotate(5deg); }

  .cover { display: block; width: 100%; margin: 0 0 2rem; filter: grayscale(1) contrast(1.6); transform: rotate(1deg); box-shadow: 4px 4px 0 var(--ink); }
  .description { border: 2px dashed var(--ink); padding: 1rem; transform: rotate(-1deg); margin: 0; }
  .description > :first-child { margin-top: 0; }
  .description > :last-child { margin-bottom: 0; }
  .description p { margin: 0 0 0.75rem; }
  .description a { color: var(--hi); }
  .description img { max-width: 100%; }
  .description ul, .description ol { padding-left: 1.25rem; margin: 0 0 0.75rem; }
  .description blockquote { border-left: 3px solid var(--hi); margin: 0 0 0.75rem; padding-left: 1rem; }
  .description .embed { margin: 1rem 0; transform: rotate(1deg); }
  .embed iframe { display: block; width: 100%; border: 0; }
  .embed-youtube iframe, .embed-vimeo iframe { aspect-ratio: 16 / 9; height: auto; }
  .embed-tiktok iframe { max-width: 325px; height: 740px; margin: 0 auto; }
  .embed-instagram iframe { max-width: 540px; height: 480px; margin: 0 auto; }
  section { margin-top: 3rem; }
  h2 {
    display: inline-block; background: var(--hi); color: var(--paper);
    padding: 0.2rem 0.75rem; margin: 0 0 1rem; font-size: 1.1rem; font-weight: 400;
    text-transform: uppercase; transform: rotate(-2deg);
  }
  section:nth-of-type(even) h2 { transform: rotate(2deg); }
  ul, ol { margin: 0; padding: 0; }
  .gigs { list-style: none; }
  .gigs li { padding: 0.5rem 0; border-bottom: 2px dashed var(--ink); }
  .gigs li:last-child { border-bottom: none; }
  .gigs time { color: var(--hi); font-weight: 700; margin-right: 0.75rem; }
  .members { list-style: none; display: flex; flex-wrap: wrap; gap: 1rem; }
  .members li {
    width: 7rem; padding: 0.5rem 0.5rem 0.75rem; text-align: center; font-size: 0.85rem;
    background: var(--paper); outline: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-3deg);
  }
  .members li:nth-child(even) { transform: rotate(2deg); }
  .snapshot {
    display: grid; place-items: center; width: 100%; aspect-ratio: 1; margin-bottom: 0.5rem; object-fit: cover;
    background: var(--ink); color: var(--paper); font-size: 2.5rem; filter: grayscale(1) contrast(1.25);
  }
  .songs { padding-left: 2rem; }
  .songs li::marker { color: var(--hi); }
  .artist { opacity: 0.6; }
  footer { text-align: center; font-size: 0.75rem; padding: 2rem 0; opacity: 0.7; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1 aria-label="{BandName}">
    <block:NameWord><span class="word" aria-hidden="true"><block:NameLetter><span class="letter">{Letter}</span></block:NameLetter></span></block:NameWord>
  </h1>
  <block:IfCoverImage><img class="cover" src="{image:Cover}" alt=""></block:IfCoverImage>
  <block:Description><div class="description">{DescriptionHTML}</div></block:Description>

  <block:Gigs>
  <section>
    <h2>Catch us live</h2>
    <ul class="gigs"><block:Gig><li><time datetime="{GigISODate}">{GigDate}</time>{GigVenue}</li></block:Gig></ul>
  </section>
  </block:Gigs>

  <block:Members>
  <section>
    <h2>Who's who</h2>
    <ul class="members">
      <block:Member>
      <li>
        <block:AvatarURL><object class="snapshot" data="{AvatarURL}" aria-hidden="true"><span class="snapshot">{MemberInitial}</span></object></block:AvatarURL>
        <block:NotAvatarURL><span class="snapshot" aria-hidden="true">{MemberInitial}</span></block:NotAvatarURL>
        {MemberName}
      </li>
      </block:Member>
    </ul>
  </section>
  </block:Members>

  <block:Songs>
  <section>
    <h2>Songs</h2>
    <ol class="songs"><block:Song><li>{SongTitle}<block:SongArtist> <span class="artist">({SongArtist})</span></block:SongArtist></li></block:Song></ol>
  </section>
  </block:Songs>
</main>
<footer>Made with <a href="/" target="_top">GigList</a></footer>
</body>
</html>
